<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'" />

    <meta name="theme-color" id="meta-theme" />
    <script src="../ext/readability-master/Readability.js"></script>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../pages/settingsDropdown.css" />
    <link rel="stylesheet" href="readerUI.css" />
    <link rel="stylesheet" href="../ext/icons/iconfont.css" />
  </head>

  <body>
    <button
      id="settings-button"
      class="i carbon:settings-adjust"
      title="Reader Settings"
      aria-label="Reader Settings"
    ></button>
    <div id="settings-dropdown" hidden>
      <div class="setting-section theme-circles">
        <button
          class="theme-circle selected"
          data-theme="light"
          title="Light"
          aria-label="Light"
        ></button>
        <button
          class="theme-circle"
          data-theme="sepia"
          title="Sepia"
          aria-label="Sepia"
        ></button>
        <button
          class="theme-circle"
          data-theme="dark"
          title="Dark"
          aria-label="Dark"
        ></button>
      </div>
      <div class="setting-section">
        <input type="checkbox" id="auto-reader-checkbox" /><label
          for="auto-reader-checkbox"
          >Always open in reader view</label
        >
      </div>
    </div>
    <div id="site-nav-links"></div>
    <div id="auto-redirect-banner" hidden>
      <label>Always open articles from this site in reader view?</label>
      <span id="auto-redirect-button-area">
        <button id="auto-redirect-no">No</button>
        <button id="auto-redirect-yes" class="primary">Yes</button>
      </span>
    </div>
    <div id="backtoarticle">
      <a id="backtoarticle-link">
        <i class="i carbon:chevron-left"></i>
        <span>Original Article</span>
      </a>
    </div>

    <!-- DOM inserted in reader.js -->

    <script src="../js/util/settings/settingsContent.js"></script>
    <script src="../js/readerDecision.js"></script>
    <script src="reader.js"></script>
    <script src="readerThemeSelector.js"></script>
  </body>
</html>
