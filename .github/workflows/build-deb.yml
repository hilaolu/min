name: Build and Release Debian Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.34.1)'
        required: true
        default: '1.34.1'

jobs:
  build-deb:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install dependencies
      run: npm install --omit=optional
      
    - name: Build Debian package
      run: npm run buildDebian
      
    - name: List built packages
      run: |
        echo "Built Debian packages:"
        ls -la dist/app/*.deb
        
    - name: Create Release (Manual)
      if: github.event_name == 'workflow_dispatch'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.event.inputs.version }}
        release_name: Release v${{ github.event.inputs.version }}
        draft: false
        prerelease: false
        
    - name: Upload Debian packages to Release (Manual)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/app/*.deb
        asset_content_type: application/vnd.debian.binary-package
        
    - name: Upload Debian packages to Release (Tag)
      if: github.event_name == 'push'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: dist/app/*.deb
        asset_content_type: application/vnd.debian.binary-package
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debian-packages
        path: dist/app/*.deb
        retention-days: 30 