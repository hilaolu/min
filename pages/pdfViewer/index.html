<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' vault: https: http: file:; font-src 'self' data:; object-src 'none'" />

    <link rel="stylesheet" href="../document.css" />
    <link rel="stylesheet" href="annotations.css" />
  </head>

  <body>
    <main id="viewer" aria-label="PDF viewer"></main>
    <div id="selection-palette" role="toolbar" aria-label="Annotate selection" hidden></div>
    <footer aria-label="Annotation status and backup">
      <p id="status" role="status">Loading PDF…</p>
      <button id="highlight" class="primary" disabled hidden>Highlight selection</button>
      <section id="annotation-editor" role="dialog" aria-label="Edit highlight" hidden>
        <label>Highlight <select id="annotations" disabled><option value="">No highlights yet</option></select></label>
        <label>Edit Note <textarea id="note" rows="3" maxlength="100000" placeholder="Enter your notes here..." disabled></textarea></label>
        <label class="color-field">Highlight color <input id="color" type="color" value="#ffcd45" disabled></label>
        <div class="actions">
          <button id="delete" disabled>Delete</button>
          <button id="close-note">Cancel</button>
          <button id="save" class="primary" disabled>Save</button>
        </div>
      </section>
      <button id="retry" hidden disabled>Retry unsaved change</button>
      <details>
        <summary>Import &amp; backup</summary>
        <button id="export">Export highlights / unsaved change</button>
        <label>Import Markdown or JSON <input id="import" type="file" accept=".md,.json,text/markdown,application/json" disabled></label>
        <p class="hint">Notes are saved in your vault; the original PDF stays unchanged. Drag or resize note boxes, or double-click to edit. Box layouts reset on reopen. Private tabs cannot access saved highlights.</p>
      </details>
      <button id="download">Download original PDF</button>
    </footer>
    <script src="../../js/util/vaultURL.js"></script>
    <script src="noteLayout.js"></script>
    <script type="module" src="embedViewer.js"></script>
  </body>
</html>
