<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' vault: https: http: file:; font-src 'self' data:; object-src 'none'" />

    <link rel="stylesheet" href="annotations.css" />
  </head>

  <body>
    <main id="viewer" aria-label="PDF viewer"></main>
    <aside aria-label="Vault highlights">
      <h1>Vault highlights</h1>
      <p id="status" role="status">Loading PDF…</p>
      <button id="highlight" disabled>Highlight selection</button>
      <label>Highlight <select id="annotations"><option value="">Select a highlight</option></select></label>
      <label>Note <textarea id="note" rows="5" maxlength="100000"></textarea></label>
      <label>Color <input id="color" type="color" value="#ffcd45"></label>
      <button id="save" disabled>Save note / color</button>
      <button id="delete" disabled>Delete highlight</button>
      <button id="retry" disabled>Retry unsaved change</button>
      <button id="export">Export highlights / unsaved change</button>
      <label>Import tab-picker Markdown / backup JSON <input id="import" type="file" accept=".md,.json,text/markdown,application/json" disabled></label>
      <button id="download">Download original PDF</button>
      <p>Highlights are saved separately in the configured vault; the original PDF is unchanged. Private tabs cannot access saved highlights.</p>
    </aside>
    <script type="module" src="embedViewer.js"></script>
  </body>
</html>
