<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" id="meta-theme" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'" />

    <link rel="stylesheet" href="viewer.css" />
    <link rel="stylesheet" href="../../ext/icons/iconfont.css" />
    <link rel="stylesheet" href="../settingsDropdown.css" />
  </head>

  <body>
    <div id="progress-bar" class="viewer-ui"></div>

    <div class="side-gutter" id="side-gutter-left">
      <div id="page-counter" class="viewer-ui hidden">
        page <input type="text" /> of <span id="total"></span>
      </div>
    </div>
    <div class="side-gutter" id="side-gutter-right">
      <button
        id="download-button"
        class="i carbon:download viewer-ui hidden"
      ></button>

      <button
        id="settings-button"
        class="i carbon:settings-adjust viewer-ui hidden"
        title="View Settings"
        aria-label="View Settings"
      ></button>

      <div id="settings-dropdown" class="viewer-ui" hidden>
        <div class="setting-section theme-circles">
          <button
            class="theme-circle selected"
            data-theme="light"
            title="Light"
            aria-label="Light"
          ></button>
          <button
            class="theme-circle"
            data-theme="sepia"
            title="Sepia"
            aria-label="Sepia"
          ></button>
          <button
            class="theme-circle"
            data-theme="dark"
            title="Dark"
            aria-label="Dark"
          ></button>
        </div>
        <div class="setting-section" id="invert-pdf-section">
          <input type="checkbox" id="invert-pdf-checkbox" /><label
            for="invert-pdf-checkbox"
            >Invert page colors</label
          >
        </div>
      </div>
    </div>
    <script src="../../js/util/settings/settingsContent.js"></script>
    <script src="../../js/util/theme.js"></script>
    <script type="module" src="viewer.js"></script>
    <script src="pdfThemeSelector.js"></script>
  </body>
</html>
