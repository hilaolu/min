<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />

    <title>An error occurred</title>
    <link rel="stylesheet" href="../pagebase.css" />
  </head>

  <body>
    <div id="page-wrapper">
      <h1>An error occurred</h1>
      <h2 id="error-message">
        <span>Your saved tabs couldn't be restored correctly.</span>
        <br />
        <br />
        <span id="backup-info"></span>
        <br />
        <br />
        <span id="link-info"
          >If this error continues to occur, please open a new issue
          <a href="https://github.com/minbrowser/min" target="_blank">here</a
          >.</span
        >
      </h2>
    </div>

    <script src="../../js/util/settings/settingsCache.js"></script>
    <script src="../../js/util/settings/settingsContent.js"></script>
    <script src="../../js/util/theme.js"></script>

    <script>
      var backupName = new URLSearchParams(window.location.search).get(
        "backupName"
      );

      var backupInfoEl = document.getElementById("backup-info");
      backupInfoEl.textContent =
        "We've saved a backup named %n in your Min profile folder.".replace(
          "%n",
          backupName
        );
    </script>
  </body>
</html>
