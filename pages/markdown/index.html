<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Markdown</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' vault: https: http: data:; media-src vault: https: http:; connect-src 'self' vault:; object-src 'none'; frame-src 'none'">
  <link rel="stylesheet" href="../../node_modules/cherry-markdown/dist/cherry-markdown.min.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <span id="path"></span>
    <div id="modes" role="group" aria-label="Editor mode">
      <button data-mode="editOnly" aria-pressed="false" disabled>Edit</button>
      <button data-mode="edit&preview" aria-pressed="true" disabled>Split</button>
      <button data-mode="previewOnly" aria-pressed="false" disabled>View</button>
    </div>
    <button id="save" title="Changes also save when focus leaves the editor" disabled>Save (Ctrl/Cmd+S)</button>
    <span id="status" role="status">Loading…</span>
  </header>
  <div id="editor"></div>
  <script src="../../js/util/vaultURL.js"></script>
  <!-- The full bundle includes Vim; the core bundle uses an unresolved bare import. -->
  <script src="../../node_modules/cherry-markdown/dist/cherry-markdown.js"></script>
  <script src="editor.js"></script>
</body>
</html>
