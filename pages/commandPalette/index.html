<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>Command Palette</title>
    <style>
      /* Reset and base styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: transparent;
        overflow: hidden;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Command Palette Container */
      #command-palette {
        width: 600px;
        max-width: 90vw;
        padding: 0;
        overflow: hidden;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(0, 0, 0, 0.1);
      }

      /* Dark mode support */
      .dark-mode #command-palette {
        background: rgb(33, 37, 43);
        border-color: rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }

      .command-palette-container {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .command-palette-input-container {
        display: flex;
        align-items: center;
        padding: 1em 1.25em;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        background: #fff;
        border-radius: 8px 8px 0 0;
      }

      .dark-mode .command-palette-input-container {
        border-bottom-color: rgba(255, 255, 255, 0.15);
        background: rgb(33, 37, 43);
      }

      .command-palette-prompt {
        font-family: "SF Mono", "Monaco", "Inconsolata", "Roboto Mono",
          monospace;
        font-size: 1.2em;
        color: #666;
        margin-right: 0.75em;
        font-weight: bold;
      }

      .dark-mode .command-palette-prompt {
        color: #aaa;
      }

      #command-palette-input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 1.1em;
        background: transparent;
        color: inherit;
        font-family: inherit;
      }

      #command-palette-input::placeholder {
        color: #999;
        opacity: 0.7;
      }

      .dark-mode #command-palette-input::placeholder {
        color: #666;
      }

      .command-palette-suggestions {
        background: #fff;
        max-height: 50vh;
        overflow-y: auto;
        border-radius: 0 0 8px 8px;
      }

      .dark-mode .command-palette-suggestions {
        background: rgb(33, 37, 43);
      }

      /* Command palette scrollbar styling */
      .command-palette-suggestions::-webkit-scrollbar {
        width: 0.25em;
      }

      .command-palette-suggestions::-webkit-scrollbar-track {
        background-color: rgba(0, 0, 0, 0.05);
      }

      .command-palette-suggestions::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.175);
        border-radius: 0.25em;
      }

      .dark-mode .command-palette-suggestions::-webkit-scrollbar-track {
        background-color: rgba(255, 255, 255, 0.1);
      }

      .dark-mode .command-palette-suggestions::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.3);
      }

      /* Responsive height adjustments */
      @media (max-height: 600px) {
        .command-palette-suggestions {
          max-height: 40vh;
        }
      }

      @media (max-height: 400px) {
        .command-palette-suggestions {
          max-height: 30vh;
        }
      }

      .command-suggestion {
        display: flex;
        align-items: center;
        padding: 0.4em 1.25em;
        cursor: default;
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
        font-family: inherit;
        font-size: 0.95em;
        color: inherit;
        transition: background-color 0.15s ease;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      .command-suggestion.selected {
        background: rgba(0, 123, 255, 0.1);
      }

      .dark-mode .command-suggestion.selected {
        background: rgba(0, 123, 255, 0.2);
      }

      .command-suggestion-icon {
        width: 1.2em;
        height: 1.2em;
        margin-right: 0.75em;
        opacity: 0.7;
      }

      .command-suggestion-content {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .command-suggestion-title {
        font-weight: 500;
        margin-bottom: 0.2em;
      }

      .command-suggestion-description {
        font-size: 0.8em;
        opacity: 0.7;
        color: #666;
      }

      .dark-mode .command-suggestion-description {
        color: #aaa;
      }

      .command-suggestion-shortcut {
        font-size: 0.8em;
        opacity: 0.6;
        color: #999;
        font-family: "SF Mono", "Monaco", "Inconsolata", "Roboto Mono",
          monospace;
      }

      .dark-mode .command-suggestion-shortcut {
        color: #666;
      }

      .command-suggestion-number {
        font-size: 0.75em;
        opacity: 0.8;
        color: #666;
        font-family: "SF Mono", "Monaco", "Inconsolata", "Roboto Mono",
          monospace;
        font-weight: bold;
        margin-right: 0.5em;
        min-width: 1.2em;
        text-align: center;
      }

      .dark-mode .command-suggestion-number {
        color: #aaa;
      }

      /* Disable text selection and mouse interactions on command palette */
      #command-palette,
      .command-palette-suggestions {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      .command-palette-empty {
        padding: 2em 1.25em;
        text-align: center;
        opacity: 0.6;
        color: #666;
      }

      .dark-mode .command-palette-empty {
        color: #aaa;
      }

      /* REPL Mode Styles */
      .repl-empty {
        padding: 2em 1.25em;
        text-align: center;
        opacity: 0.6;
        color: #666;
        font-family: "SF Mono", "Monaco", "Inconsolata", "Roboto Mono",
          monospace;
        font-style: italic;
      }

      .dark-mode .repl-empty {
        color: #aaa;
      }

      .repl-history-entry {
        padding: 1em 1.25em;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        font-family: "SF Mono", "Monaco", "Inconsolata", "Roboto Mono",
          monospace;
        font-size: 0.9em;
        line-height: 1.5;
      }

      .dark-mode .repl-history-entry {
        border-bottom-color: rgba(255, 255, 255, 0.1);
      }

      .repl-input-line {
        margin-bottom: 0.6em;
        display: flex;
        align-items: flex-start;
      }

      .repl-output-line {
        display: flex;
        align-items: flex-start;
        margin-bottom: 1em;
      }

      .repl-prompt-label {
        color: #007acc;
        font-weight: bold;
        margin-right: 0.1em;
        min-width: 2.5em;
        flex-shrink: 0;
        text-align: left;
      }

      .dark-mode .repl-prompt-label {
        color: #4fc3f7;
      }

      .repl-prompt-number {
        color: #007acc;
        font-weight: bold;
        margin-right: 0.5em;
        min-width: 3em;
        flex-shrink: 0;
        text-align: left;
      }

      .dark-mode .repl-prompt-number {
        color: #4fc3f7;
      }

      .repl-input-code {
        color: #333;
        white-space: pre-wrap;
        word-break: break-word;
        flex: 1;
        padding-left: 0.2em;
      }

      .dark-mode .repl-input-code {
        color: #e0e0e0;
      }

      .repl-output {
        color: #666;
        white-space: pre-wrap;
        word-break: break-word;
        flex: 1;
        background: rgba(0, 0, 0, 0.02);
        padding: 0.3em 0.5em;
        border-radius: 3px;
        border-left: 3px solid #4caf50;
        margin-left: 0.2em;
      }

      .dark-mode .repl-output {
        color: #ccc;
        background: rgba(255, 255, 255, 0.05);
        border-left-color: #4caf50;
      }

      .repl-output-error {
        color: #d32f2f;
        white-space: pre-wrap;
        word-break: break-word;
        flex: 1;
        background: rgba(211, 47, 47, 0.1);
        padding: 0.3em 0.5em;
        border-radius: 3px;
        border-left: 3px solid #d32f2f;
        margin-left: 0.2em;
      }

      .dark-mode .repl-output-error {
        color: #f44336;
        background: rgba(244, 67, 54, 0.15);
        border-left-color: #f44336;
      }

      /* REPL mode input styling */
      #command-palette-input.repl-mode {
        font-family: "SF Mono", "Monaco", "Inconsolata", "Roboto Mono",
          monospace;
        color: #007acc;
      }

      .dark-mode #command-palette-input.repl-mode {
        color: #4fc3f7;
      }

      /* Icon font support */
      .i {
        font-family: "Carbon";
        font-style: normal;
        font-weight: normal;
        font-variant: normal;
        text-transform: none;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Placeholder for icon font - will be loaded by main process */
      .i.carbon\:search::before {
        content: "🔍";
      }
      .i.carbon\:close::before {
        content: "✕";
      }
      .i.carbon\:new-tab::before {
        content: "➕";
      }
      .i.carbon\:bookmark::before {
        content: "🔖";
      }
      .i.carbon\:time::before {
        content: "⏰";
      }
      .i.carbon\:renew::before {
        content: "🔄";
      }
      .i.carbon\:new-window::before {
        content: "🪟";
      }
    </style>
  </head>
  <body>
    <div id="command-palette">
      <div class="command-palette-container">
        <div class="command-palette-input-container">
          <input
            type="text"
            id="command-palette-input"
            placeholder="Search tabs or type >w, >r..."
          />
        </div>
        <div
          id="command-palette-suggestions"
          class="command-palette-suggestions has-thin-scrollbar"
        >
          <!-- Command suggestions will be populated here -->
          <div class="command-palette-empty">
            Type to search or use commands
          </div>
        </div>
      </div>
    </div>

    <script>
      // Basic functionality for the command palette overlay
      let isVisible = false;
      let selectedIndex = 0;
      let currentCandidates = [];

      // Get DOM elements
      const input = document.getElementById("command-palette-input");
      const suggestions = document.getElementById(
        "command-palette-suggestions"
      );

      // Initialize the command palette
      function initialize() {
        // Focus the input when the overlay is shown
        setTimeout(() => {
          input.focus();
        }, 100);

        // Set up input event listener
        input.addEventListener("input", handleInput);
        input.addEventListener("keydown", handleKeydown);

        // Close when clicking outside (though this shouldn't happen in overlay)
        document.addEventListener("click", function (e) {
          if (e.target === document.body) {
            hide();
          }
        });
      }

      // Handle input changes
      function handleInput() {
        const inputValue = input.value;
        // This will be replaced with RPC call to main process
        console.log("Input changed:", inputValue);
      }

      // Handle keyboard events
      function handleKeydown(e) {
        switch (e.key) {
          case "ArrowDown":
            e.preventDefault();
            selectedIndex = Math.min(
              selectedIndex + 1,
              currentCandidates.length - 1
            );
            updateSelection();
            break;

          case "ArrowUp":
            e.preventDefault();
            selectedIndex = Math.max(selectedIndex - 1, 0);
            updateSelection();
            break;

          case "Enter":
            e.preventDefault();
            if (currentCandidates.length > 0) {
              const selectedCandidate = currentCandidates[selectedIndex];
              executeAction(selectedCandidate);
            }
            break;

          case "Escape":
            e.preventDefault();
            hide();
            break;
        }
      }

      // Update selection highlighting
      function updateSelection() {
        const suggestionElements = suggestions.querySelectorAll(
          ".command-suggestion"
        );
        suggestionElements.forEach((suggestion, index) => {
          if (index === selectedIndex) {
            suggestion.classList.add("selected");
          } else {
            suggestion.classList.remove("selected");
          }
        });
      }

      // Execute action for selected candidate
      function executeAction(candidate) {
        if (!candidate) return;
        console.log("Executing action:", candidate);
        // This will be replaced with RPC call to main process
        hide();
      }

      // Show the command palette
      function show() {
        if (isVisible) return;
        isVisible = true;
        document.body.style.display = "flex";
        selectedIndex = 0;
        input.value = "";
        input.focus();
      }

      // Hide the command palette
      function hide() {
        if (!isVisible) return;
        isVisible = false;
        document.body.style.display = "none";
        input.blur();
        selectedIndex = 0;
        currentCandidates = [];
      }

      // Update suggestions (called via RPC from main process)
      function updateSuggestions(candidates) {
        currentCandidates = candidates || [];
        selectedIndex = 0;

        // Clear existing suggestions
        suggestions.innerHTML = "";

        if (currentCandidates.length === 0) {
          suggestions.innerHTML =
            '<div class="command-palette-empty">No results found</div>';
          return;
        }

        // Add new suggestions
        currentCandidates.forEach((candidate, index) => {
          const suggestionEl = document.createElement("button");
          suggestionEl.className = "command-suggestion";

          let description = candidate.description || "";
          if (description && description.length > 60) {
            description = description.substring(0, 60) + "...";
          }

          // Show keyboard shortcut number for candidates (0-9)
          const shortcutNumber =
            index < 10
              ? `<div class="command-suggestion-number">${index}</div>`
              : "";

          suggestionEl.innerHTML = `
          ${shortcutNumber}
          <i class="i ${
            candidate.icon || "carbon:search"
          } command-suggestion-icon"></i>
          <div class="command-suggestion-content">
            <div class="command-suggestion-title">${
              candidate.title || "Untitled"
            }</div>
            <div class="command-suggestion-description">${description}</div>
          </div>
          ${
            candidate.shortcut
              ? `<div class="command-suggestion-shortcut">${candidate.shortcut}</div>`
              : ""
          }
        `;

          // Disable mouse interactions to prevent interference with keyboard navigation
          const preventMouseInteraction = (e) => {
            e.preventDefault();
            e.stopPropagation();
          };

          suggestionEl.addEventListener("click", preventMouseInteraction);
          suggestionEl.addEventListener("mousedown", preventMouseInteraction);
          suggestionEl.addEventListener("mouseenter", preventMouseInteraction);

          suggestions.appendChild(suggestionEl);
        });

        updateSelection();
      }

      // Set input value (called via RPC from main process)
      function setInputValue(value) {
        input.value = value;
      }

      // Focus input (called via RPC from main process)
      function focusInput() {
        input.focus();
      }

      // Initialize when the page loads
      document.addEventListener("DOMContentLoaded", initialize);

      // Make functions available globally for RPC calls
      window.commandPaletteOverlay = {
        show,
        hide,
        updateSuggestions,
        setInputValue,
        focusInput,
        handleInput,
        handleKeydown,
      };
    </script>
  </body>
</html>
